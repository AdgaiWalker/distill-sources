<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哥飞出海实战文库 · 450篇全景分类索引与速览阅读器</title>
  <style>
    :root[data-theme="dark"] {
      --bg-primary: #0a0f1d;
      --bg-secondary: #111827;
      --bg-card: #162036;
      --bg-card-hover: #1e2c4a;
      --bg-glass: rgba(17, 24, 39, 0.88);
      --border-color: rgba(255, 255, 255, 0.09);
      --border-highlight: rgba(99, 102, 241, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.28);
      --read-color: #10b981;
      --read-bg: rgba(16, 185, 129, 0.12);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.65);
      --drawer-bg: #0d1424;
    }

    :root[data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --bg-glass: rgba(255, 255, 255, 0.92);
      --border-color: #e2e8f0;
      --border-highlight: rgba(99, 102, 241, 0.5);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.2);
      --read-color: #059669;
      --read-bg: rgba(16, 185, 129, 0.1);
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 20px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 35px rgba(15, 23, 42, 0.12);
      --drawer-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(56, 189, 248, 0.06) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .badge-hero {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--accent-glow);
      border: 1px solid var(--border-highlight);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .badge-hero span.dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
      max-width: 760px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-1px);
    }

    /* Progress Stats Card */
    .progress-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .progress-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-meta {
      display: flex;
      flex-direction: column;
    }

    .progress-title {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .progress-count {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .progress-bar-wrap {
      flex: 1;
      min-width: 200px;
      max-width: 480px;
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4, #6366f1);
      width: 0%;
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    /* Sticky Search & Filter Toolbar */
    .filter-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-radius 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .filter-toolbar.is-stuck {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-top-color: transparent;
      background: rgba(17, 24, 39, 0.96);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    :root[data-theme="light"] .filter-toolbar.is-stuck {
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg.search-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 40px 10px 42px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      padding: 4px;
      border-radius: 50%;
    }
    .clear-search-btn:hover { color: var(--text-primary); }

    /* Category Pill Selector */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .pill-btn:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-highlight);
    }

    .pill-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .pill-btn .pill-count {
      padding: 1px 6px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      font-size: 11px;
    }

    :root[data-theme="light"] .pill-btn:not(.active) .pill-count {
      background: rgba(0, 0, 0, 0.08);
    }

    /* Sub Filters & Sort Row */
    .sub-filters-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .select-dropdown {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .view-toggle-btns {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-color);
    }

    .view-btn {
      background: none;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
    }

    .view-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    /* Articles Grid / List */
    .results-count {
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .articles-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Article Card Style */
    .article-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .article-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .article-card.is-read {
      opacity: 0.72;
      border-left: 4px solid var(--read-color);
    }
    .article-card.is-read:hover {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .category-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    /* Category Specific Colors */
    .cat-cases { background: rgba(139, 92, 246, 0.16); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
    .cat-growth { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .cat-seo { background: rgba(6, 182, 212, 0.16); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .cat-monetization { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .cat-tech { background: rgba(236, 72, 153, 0.16); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .cat-ai { background: rgba(99, 102, 241, 0.16); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

    .card-id-year {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .article-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-item {
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      margin-top: 4px;
      font-size: 12px;
    }

    .read-mode-hint {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-weight: 600;
    }

    .mark-read-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .mark-read-toggle:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .mark-read-toggle.active {
      color: var(--read-color);
      font-weight: 600;
    }

    /* List Row View Style */
    .article-row {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .article-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
    }
    .article-row.is-read {
      opacity: 0.72;
      border-left: 3px solid var(--read-color);
    }
    .row-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .row-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }

    /* READER DRAWER (The "只看" Mode) */
    .reader-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .reader-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-drawer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      background: var(--drawer-bg);
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .reader-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 10px 18px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .drawer-title-box {
      flex: 1;
      min-width: 0;
    }
    .drawer-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drawer-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .drawer-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .drawer-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .drawer-btn:hover {
      background: var(--bg-card);
      border-color: var(--border-highlight);
    }
    .drawer-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .drawer-btn.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .drawer-body {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 55px);
      overflow: hidden;
      position: relative;
    }

    /* 1 查看文章面板 */
    .reader-article-panel {
      flex: 1;
      height: 100%;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #ffffff;
    }

    .reader-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--drawer-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 5;
      transition: opacity 0.25s ease;
    }

    /* 可拖拽分栏条及折叠切换 */
    .panel-resizer {
      width: 10px;
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      cursor: col-resize;
      flex-shrink: 0;
      position: relative;
      z-index: 25;
      transition: background 0.15s ease, width 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .panel-resizer::after {
      content: '';
      width: 2px;
      height: 28px;
      background: var(--text-muted);
      border-radius: 2px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .panel-resizer:hover, .panel-resizer.is-dragging {
      background: var(--accent);
    }
    .panel-resizer:hover::after, .panel-resizer.is-dragging::after {
      background: #ffffff;
      opacity: 1;
    }

    /* 当笔记面板折叠时的吸附拉手 */
    .panel-resizer.is-collapsed {
      cursor: pointer;
      width: 16px;
      border-right: none;
      background: var(--bg-secondary);
    }
    .panel-resizer.is-collapsed::after {
      display: none;
    }
    .panel-resizer.is-collapsed:hover {
      background: var(--bg-card-hover);
    }

    /* 居中常驻的悬浮折叠/展开按钮 */
    .resizer-toggle-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 46px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      z-index: 30;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0;
    }
    .resizer-toggle-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: translate(-50%, -50%) scale(1.12);
    }
    .resizer-toggle-btn svg {
      transition: transform 0.2s ease;
    }
    .panel-resizer.is-collapsed .resizer-toggle-btn {
      right: 0;
      left: auto;
      transform: translateY(-50%);
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: none;
      width: 20px;
      height: 52px;
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
    }
    .panel-resizer.is-collapsed .resizer-toggle-btn:hover {
      transform: translateY(-50%) scale(1.08);
      background: var(--accent-hover);
    }

    /* 2 记笔记面板 */
    .reader-notes-panel {
      width: 420px;
      min-width: 280px;
      max-width: 800px;
      height: 100%;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 15;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reader-notes-panel.collapsed {
      display: none;
    }

    .notes-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .notes-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notes-status-badge {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-primary);
      transition: color 0.2s ease;
    }
    .notes-status-badge.saved {
      color: #10b981;
    }
    .notes-status-badge.saving {
      color: #f59e0b;
    }

    .notes-toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--bg-glass);
      flex-shrink: 0;
    }

    .note-tool-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .note-tool-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-highlight);
    }

    .notes-editor-wrap {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-textarea {
      width: 100%;
      height: 100%;
      resize: none;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .notes-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
      background: var(--bg-card);
    }
    .notes-textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.8;
      font-size: 12px;
      line-height: 1.6;
    }

    .notes-footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .note-pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    mark.highlight {
      background: rgba(253, 224, 71, 0.35);
      color: inherit;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .empty-state {
      padding: 64px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* 移动端专有按键与抽屉遮罩 */
    .mobile-close-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .mobile-close-btn:active {
      transform: scale(0.92);
      background: var(--bg-card-hover);
    }

    .notes-mobile-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 95;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .notes-mobile-backdrop.show {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    /* 移动端全面优化适配 (<= 768px) */
    @media (max-width: 768px) {
      /* 1. 首页容器与检索栏极简紧凑化，消除边距浪费 */
      .container {
        padding: 16px 12px 60px;
      }
      header {
        margin-bottom: 16px;
        gap: 12px;
      }
      .badge-hero {
        font-size: 11px;
        padding: 3px 10px;
      }
      h1 {
        font-size: 20px;
        gap: 8px;
        line-height: 1.35;
      }
      .subtitle {
        font-size: 12px;
      }
      .top-bar {
        gap: 12px;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .action-btn {
        padding: 6px 10px;
        font-size: 12px;
      }

      .filter-toolbar {
        top: 0;
        padding: 10px;
        border-radius: 12px;
        gap: 10px;
      }
      .search-input {
        font-size: 13px;
        padding: 8px 36px 8px 36px;
      }
      .category-pills {
        gap: 6px;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
      }
      .pill-btn {
        padding: 5px 10px;
        font-size: 12px;
        flex-shrink: 0;
        border-radius: 6px;
      }
      .sub-filters-row {
        gap: 8px;
      }
      .filter-group {
        flex: 1;
        min-width: 120px;
      }
      .select-dropdown {
        width: 100%;
        font-size: 12px;
        padding: 5px 8px;
      }
      .view-toggle-btns {
        display: none; /* 移动端默认自适应单列卡片视图 */
      }
      .articles-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .article-card {
        padding: 14px 16px;
        border-radius: 12px;
        gap: 8px;
      }
      .article-title {
        font-size: 14px;
      }

      /* 2. 阅读器：100% 满屏沉浸阅读空间 */
      .reader-drawer {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      /* 超薄顶部栏：高度仅 48px，保留标题与直接关闭按钮 */
      .drawer-header {
        height: 48px;
        min-height: 48px;
        padding: 6px 12px;
        gap: 10px;
      }
      .mobile-close-btn {
        display: flex;
      }
      .drawer-title-box {
        flex: 1;
        min-width: 0;
      }
      .drawer-title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
      }
      .drawer-meta {
        font-size: 11px;
        gap: 6px;
        margin-top: 1px;
      }

      /* 底部常驻单手快捷操作栏：上一篇、标已读、记笔记、下一篇 一触即达 */
      .drawer-toolbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 52px;
        background: var(--bg-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 4px 6px;
        padding-bottom: env(safe-area-inset-bottom, 4px);
        z-index: 30;
      }
      .drawer-btn {
        flex: 1;
        max-width: 96px;
        height: 38px;
        padding: 0 4px;
        font-size: 12px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        white-space: nowrap;
      }
      #closeReaderBtn {
        display: none; /* 移动端已在右上角常驻专属圆形关闭按钮 */
      }

      /* 阅读主体：占满视口 100% 空间，无任何压缩与遮挡 */
      .drawer-body {
        height: calc(100vh - 48px - 52px);
        height: calc(100dvh - 48px - 52px);
        width: 100%;
        overflow: hidden;
        flex-direction: row;
      }
      .reader-article-panel {
        width: 100% !important;
        height: 100% !important;
        min-width: 0 !important;
        flex: 1 1 100% !important;
      }
      .iframe-container {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .reader-iframe {
        width: 100%;
        height: 100%;
        min-height: 100%;
      }
      .panel-resizer {
        display: none !important; /* 移动端隐藏桌面端拖拽条 */
      }

      /* 3. 笔记面板：在移动端优雅转化为现代感底部弹出抽屉 (BottomSheet) */
      .reader-notes-panel {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 78vh !important;
        height: 78dvh !important;
        border-radius: 20px 20px 0 0 !important;
        border-left: none !important;
        border-top: 1px solid var(--border-highlight) !important;
        box-shadow: 0 -12px 35px rgba(0, 0, 0, 0.6) !important;
        z-index: 100 !important;
        transform: translateY(100%);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
        display: flex !important;
      }
      .reader-notes-panel:not(.collapsed) {
        transform: translateY(0) !important;
      }
      .reader-notes-panel.collapsed {
        transform: translateY(100%) !important;
        pointer-events: none !important;
      }
      .notes-header {
        padding: 12px 16px;
      }
      .notes-toolbar {
        padding: 6px 10px;
        gap: 4px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      .note-tool-btn {
        flex-shrink: 0;
        font-size: 11px;
        padding: 5px 8px;
      }
      .notes-editor-wrap {
        padding: 10px;
      }
      .notes-textarea {
        font-size: 14px; /* 移动端 14px 避免 iOS 输入框自动放大视口 */
      }
      .notes-footer {
        padding-bottom: env(safe-area-inset-bottom, 8px);
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="container">
    <header>
      <div class="top-bar">
        <div>
          <div class="badge-hero"><span class="dot"></span> 哥飞社群精华离线知识库 · 共收录 449 篇</div>
          <h1>哥飞出海实战文库全景分类索引</h1>
          <p class="subtitle">涵盖海外爆款案例拆解 · 关键词挖掘与SEO · 广告与出单变现 · 技术开发部署 · AI工具提示词</p>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="action-btn" title="切换浅色/深色主题">
            <span id="themeIcon">☀️</span> 主题
          </button>
          <button id="resetReadProgressBtn" class="action-btn" title="清空已读进度" style="color:var(--text-muted);">
            重置进度
          </button>
        </div>
      </div>

      <!-- 阅读进度看板 -->
      <div class="progress-banner">
        <div class="progress-info">
          <div style="font-size:28px;">📖</div>
          <div class="progress-meta">
            <span class="progress-title">出海学习只看进度</span>
            <span class="progress-count" id="progressText">已读 0 / 449 篇 (0%)</span>
          </div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>
    </header>

    <!-- 筛选与搜索工具条吸顶哨兵与容器 -->
    <div id="stickySentinel" style="height: 1px; margin-top: -1px; pointer-events: none;"></div>
    <div class="filter-toolbar" id="filterToolbar">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="">
          <button id="clearSearchBtn" class="clear-search-btn" title="清空搜索">✕</button>
        </div>
      </div>

      <!-- 分类胶囊选择器 (使用稳健英文 cat_id) -->
      <div class="category-pills" id="categoryPills">
        <button class="pill-btn active" data-cat="all">
          🌟 全部文章 <span class="pill-count" id="count-all">449</span>
        </button>
        <button class="pill-btn" data-cat="cases">
          🔍 爆款与优秀网站案例拆解 <span class="pill-count" id="count-cases">167</span>
        </button>
        <button class="pill-btn" data-cat="growth">
          📈 实战复盘、新手成长与出海心路 <span class="pill-count" id="count-growth">104</span>
        </button>
        <button class="pill-btn" data-cat="seo">
          🚀 SEO流量、关键词挖掘与外链 <span class="pill-count" id="count-seo">81</span>
        </button>
        <button class="pill-btn" data-cat="monetization">
          💰 商业变现、广告收益与支付出单 <span class="pill-count" id="count-monetization">55</span>
        </button>
        <button class="pill-btn" data-cat="tech">
          🛠️ 技术建站、开发部署与域名运维 <span class="pill-count" id="count-tech">22</span>
        </button>
        <button class="pill-btn" data-cat="ai">
          🤖 AI应用、效率工具与提示词实操 <span class="pill-count" id="count-ai">20</span>
        </button>
      </div>

      <div class="sub-filters-row">
        <div class="filter-group">
          <span class="filter-label">年份:</span>
          <select id="yearSelect" class="select-dropdown">
            <option value="all">全部年份</option>
            <option value="2025">2025 年 (193篇)</option>
            <option value="2026">2026 年 (256篇)</option>
          </select>

          <span class="filter-label" style="margin-left:8px;">状态:</span>
          <select id="readStatusSelect" class="select-dropdown">
            <option value="all">全部状态</option>
            <option value="unread">未读</option>
            <option value="read">已读</option>
            <option value="has_notes">📝 已记笔记</option>
          </select>

          <span class="filter-label" style="margin-left:8px;">排序:</span>
          <select id="sortSelect" class="select-dropdown">
            <option value="id-asc">原始目录顺序</option>
            <option value="year-desc">最新年份优先</option>
            <option value="title-asc">标题 A-Z</option>
          </select>
        </div>

        <div class="view-toggle-btns">
          <button id="viewGridBtn" class="view-btn active" title="卡片网格视图">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> 卡片
          </button>
          <button id="viewListBtn" class="view-btn" title="紧凑列表视图">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg> 列表
          </button>
        </div>
      </div>
    </div>

    <!-- 结果统计 -->
    <div class="results-count">
      <span id="filteredStats">加载中...</span>
    </div>

    <!-- 列表容器 -->
    <div id="articlesContainer" class="articles-grid"></div>
  </div>

  <!-- 沉浸式双栏工作台：1 查看文章 + 2 记笔记 -->
  <div id="readerBackdrop" class="reader-backdrop"></div>
  <div id="notesMobileBackdrop" class="notes-mobile-backdrop"></div>
  <aside id="readerDrawer" class="reader-drawer">

      <div class="drawer-title-box">
        <div class="drawer-title" id="drawerArticleTitle">文章标题</div>

          <span id="drawerCatTag" class="category-tag">分类</span>
          <span id="drawerYearTag">年份</span>
          <span id="drawerArticleIndex" style="color:var(--text-muted);">#0</span>

          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>

        <button id="toggleNotesBtn" class="drawer-btn active" title="显示/收起笔记面板 (快捷键 N)">
          <span id="toggleNotesIcon">📝</span> <span id="toggleNotesLabel">记笔记</span>

        <button id="nextArticleBtn" class="drawer-btn" title="下一篇 (快捷键 → 或 ])">

        <button id="closeReaderBtn" class="drawer-btn primary" title="关闭 (快捷键 ESC)">
          ✕ 关闭
        </button>
      </div>
    </div>

    <!-- 双栏主体：1 查看文章 + 2 记笔记 -->
    <div class="drawer-body" id="drawerBody">
      <!-- 1 查看文章 -->
      <section class="reader-article-panel" id="readerArticlePanel">

          <div id="loadingOverlay" class="loading-overlay">

          <div style="display:flex; align-items:center; gap:8px;">
            <div class="notes-status-badge saved" id="notesStatus">✓ 已自动保存</div>
            <button id="notesCollapseHeaderBtn" class="note-tool-btn" style="padding:3px 8px; font-size:11px;" title="折叠笔记面板 (快捷键 N)">

      updateProgress();
    }

    function saveReadState() {
      try {
        localStorage.setItem('gefei_read_articles', JSON.stringify(Array.from(readArticlesSet)));
      } catch (e) {
        console.error(e);
      }
      updateProgress();
    }

    function updateProgress() {
      const total = RAW_ARTICLES.length;
      const readCount = readArticlesSet.size;
      const pct = Math.round((readCount / total) * 100);
      document.getElementById('progressText').textContent = `已读 ${readCount} / ${total} 篇 (${pct}%)`;
      document.getElementById('progressBar').style.width = pct + '%';
    }

    function toggleRead(articleId) {
      if (readArticlesSet.has(articleId)) {
        readArticlesSet.delete(articleId);
      } else {
        readArticlesSet.add(articleId);
      }
      saveReadState();
      renderArticles();
      updateReaderControls();
    }

    function getFilteredArticles() {
      const q = currentFilter.search.trim().toLowerCase();
      return RAW_ARTICLES.filter(item => {
        // category filter by cat_id
        if (currentFilter.category !== 'all' && item.cat_id !== currentFilter.category) {
          return false;
        }
        // year filter
        if (currentFilter.year !== 'all' && item.year !== currentFilter.year) {
          return false;
        }
        // read status filter
        const isRead = readArticlesSet.has(item.id);
        if (currentFilter.readStatus === 'read' && !isRead) return false;
        if (currentFilter.readStatus === 'unread' && isRead) return false;
        if (currentFilter.readStatus === 'has_notes') {
          const hasNote = Boolean(allNotes[item.id] && allNotes[item.id].trim());
          if (!hasNote) return false;
        }

        // search keyword
        if (q) {
          const matchTitle = (item.title || '').toLowerCase().includes(q);
          const matchRaw = (item.raw_title || '').toLowerCase().includes(q);
          const matchCat = (item.category || '').toLowerCase().includes(q);
          
          let matchTags = false;
          if (Array.isArray(item.tags)) {
            matchTags = item.tags.some(t => String(t).toLowerCase().includes(q));
          } else if (typeof item.tags === 'string') {
            matchTags = item.tags.toLowerCase().includes(q);
          }
          
          if (!matchTitle && !matchRaw && !matchCat && !matchTags) {
            return false;
          }
        }
        return true;
      }).sort((a, b) => {
        if (currentFilter.sort === 'year-desc') {
          if (b.year !== a.year) return b.year.localeCompare(a.year);
          return b.id - a.id;
        } else if (currentFilter.sort === 'title-asc') {
          return a.title.localeCompare(b.title, 'zh');
        }
        return a.id - b.id;
      });
    }

    function highlightText(text, keyword) {
      if (!keyword || !keyword.trim()) return escapeHtml(text);
      const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${safeKeyword})`, 'gi');
      return escapeHtml(text).replace(regex, '<mark class="highlight">$1</mark>');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
    }

    function renderArticles() {
      try {
        const container = document.getElementById('articlesContainer');
        currentFilteredList = getFilteredArticles();

        const statsEl = document.getElementById('filteredStats');
        if (currentFilteredList.length === RAW_ARTICLES.length) {
          statsEl.textContent = `展示全部 ${RAW_ARTICLES.length} 篇文章`;
        } else {
          statsEl.textContent = `共筛选出 ${currentFilteredList.length} 篇符合条件的文章 (总库 ${RAW_ARTICLES.length} 篇)`;
        }

        if (currentFilteredList.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <h3>未找到符合条件的文章</h3>
              <p style="margin-top:6px; font-size:13px;">请尝试更换关键词或重置分类筛选</p>
            </div>
          `;
          return;
        }

        const q = currentFilter.search.trim();

        if (currentFilter.viewMode === 'grid') {
          container.className = 'articles-grid';
          container.innerHTML = currentFilteredList.map((item, index) => {
            const isRead = readArticlesSet.has(item.id);
            const catClass = CAT_CLASS_MAP[item.cat_id] || 'cat-cases';
            const hasNote = Boolean(allNotes[item.id] && allNotes[item.id].trim());
            const noteBadge = hasNote ? `<span class="note-pill-badge" title="该篇已记录实战笔记">📝 笔记</span>` : '';
            
            // 安全处理 tags
            const tagsArr = Array.isArray(item.tags) ? item.tags : (item.tags ? [item.tags] : []);
            const tagsHtml = tagsArr.map(t => `<span class="tag-item">#${escapeHtml(t)}</span>`).join('');

            return `
              <div class="article-card ${isRead ? 'is-read' : ''}" onclick="openReaderByIndex(${index})">
                <div class="card-top">
                  <div style="display:flex; align-items:center; gap:6px;">
                    <span class="category-tag ${catClass}">${escapeHtml(item.category)}</span>
                    ${noteBadge}
                  </div>
                  <span class="card-id-year">${item.year} · #${item.id}</span>
                </div>
                <h3 class="article-title" title="${escapeHtml(item.title)}">${highlightText(item.title, q)}</h3>
                <div class="tags-container">${tagsHtml}</div>
                <div class="card-actions">
                  <span class="read-mode-hint">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    点击只看阅读
                  </span>
                  <div class="mark-read-toggle ${isRead ? 'active' : ''}" onclick="event.stopPropagation(); toggleRead(${item.id});" title="切换已读状态">
                    <span>${isRead ? '✓ 已读' : '○ 标为已读'}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          container.className = 'articles-list';
          container.innerHTML = currentFilteredList.map((item, index) => {
            const isRead = readArticlesSet.has(item.id);
            const catClass = CAT_CLASS_MAP[item.cat_id] || 'cat-cases';
            const hasNote = Boolean(allNotes[item.id] && allNotes[item.id].trim());
            const noteBadge = hasNote ? `<span class="note-pill-badge" style="margin-right:6px;" title="该篇已记录实战笔记">📝 笔记</span>` : '';
            return `
              <div class="article-row ${isRead ? 'is-read' : ''}" onclick="openReaderByIndex(${index})">
                <div class="row-left">
                  <span class="card-id-year" style="width:50px;">#${item.id}</span>
                  <span class="category-tag ${catClass}" style="flex-shrink:0;">${escapeHtml(item.category)}</span>
                  ${noteBadge}
                  <span class="row-title" title="${escapeHtml(item.title)}">${highlightText(item.title, q)}</span>
                </div>
                <div class="row-right">
                  <span style="color:var(--text-muted);">${item.year}</span>
                  <div class="mark-read-toggle ${isRead ? 'active' : ''}" onclick="event.stopPropagation(); toggleRead(${item.id});">
                    ${isRead ? '✓ 已读' : '○ 未读'}
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        console.error("renderArticles error:", err);
        const container = document.getElementById('articlesContainer');
        container.innerHTML = `<div style="padding:20px; color:#ef4444; background:rgba(239,68,68,0.1); border-radius:8px;">加载发生异常: ${escapeHtml(err.message)}</div>`;
      }
    }

    function flushSaveCurrentNote() {
      if (currentReadingIndex < 0 || currentReadingIndex >= currentFilteredList.length) return;
      const article = currentFilteredList[currentReadingIndex];
      const textarea = document.getElementById('articleNotesTextarea');
      if (!textarea) return;
      const text = textarea.value;
      if (text.trim()) {
        allNotes[article.id] = text;
      } else {
        delete allNotes[article.id];
      }
      saveNotesState();
      renderArticles();
    }

    function updateNotesStats() {
      const textarea = document.getElementById('articleNotesTextarea');
      const countEl = document.getElementById('notesWordCount');
      const statusEl = document.getElementById('notesStatus');
      const text = textarea ? textarea.value : '';
      if (countEl) countEl.textContent = `${text.length} 字`;
      if (statusEl) {
        statusEl.className = 'notes-status-badge saved';
        statusEl.textContent = text.trim() ? '✓ 已自动保存' : '空白新笔记';
      }
    }

    function insertNoteSnippet(snippet) {
      const textarea = document.getElementById('articleNotesTextarea');
      if (!textarea) return;
      textarea.focus();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const before = textarea.value.substring(0, start);
      const after = textarea.value.substring(end);
      textarea.value = before + snippet + after;
      textarea.selectionStart = textarea.selectionEnd = start + snippet.length;
      textarea.dispatchEvent(new Event('input'));
    }

    function openReaderByIndex(index) {
      if (index < 0 || index >= currentFilteredList.length) return;
      
      // 保存前一篇的笔记（如有）
      flushSaveCurrentNote();

      currentReadingIndex = index;
      const article = currentFilteredList[index];

      const backdrop = document.getElementById('readerBackdrop');
      const drawer = document.getElementById('readerDrawer');
      const iframe = document.getElementById('readerIframe');
      const loading = document.getElementById('loadingOverlay');

      document.getElementById('drawerArticleTitle').textContent = article.title;
      document.getElementById('drawerCatTag').textContent = article.category;
      document.getElementById('drawerCatTag').className = 'category-tag ' + (CAT_CLASS_MAP[article.cat_id] || 'cat-cases');
      document.getElementById('drawerYearTag').textContent = article.year + ' 年';
      document.getElementById('drawerArticleIndex').textContent = `#${article.id} (${index + 1}/${currentFilteredList.length})`;

      // 加载当前文章的专属笔记
      const notesTextarea = document.getElementById('articleNotesTextarea');
      const noteContent = allNotes[article.id] || '';
      if (notesTextarea) {
        notesTextarea.value = noteContent;
      }
      updateNotesStats();

      loading.style.display = 'flex';
      loading.style.opacity = '1';

      iframe.src = article.path;
      iframe.onload = () => {
        loading.style.opacity = '0';
        setTimeout(() => { loading.style.display = 'none'; }, 200);
      };

      updateReaderControls();

      // 移动端打开文章时默认收起笔记，将 100% 满屏空间留给文章阅读
      if (window.innerWidth <= 768 && typeof updateNotesCollapseState === 'function') {
        updateNotesCollapseState(true);
      }

      backdrop.classList.add('open');
      drawer.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeReader() {
      flushSaveCurrentNote();
      const backdrop = document.getElementById('readerBackdrop');
      const drawer = document.getElementById('readerDrawer');
      const iframe = document.getElementById('readerIframe');
      const mobileBackdrop = document.getElementById('notesMobileBackdrop');

      backdrop.classList.remove('open');
      drawer.classList.remove('open');
      if (mobileBackdrop) mobileBackdrop.classList.remove('show');
      document.body.style.overflow = '';
      iframe.src = 'about:blank';
    }

    function updateReaderControls() {
      if (currentReadingIndex < 0 || currentReadingIndex >= currentFilteredList.length) return;
      const article = currentFilteredList[currentReadingIndex];
      const isRead = readArticlesSet.has(article.id);

      const markBtn = document.getElementById('markReadBtn');
      const markIcon = document.getElementById('markReadIcon');
      const markLabel = document.getElementById('markReadLabel');

      if (isRead) {
        markBtn.style.background = 'var(--read-bg)';
        markBtn.style.color = 'var(--read-color)';
        markBtn.style.borderColor = 'var(--read-color)';
        markIcon.textContent = '✓';
        markLabel.textContent = '已读';
      } else {
        markBtn.style.background = 'var(--bg-secondary)';
        markBtn.style.color = 'var(--text-primary)';
        markBtn.style.borderColor = 'var(--border-color)';
        markIcon.textContent = '○';
        markLabel.textContent = '标为已读';
      }

      document.getElementById('prevArticleBtn').disabled = (currentReadingIndex === 0);
      document.getElementById('prevArticleBtn').style.opacity = (currentReadingIndex === 0) ? '0.4' : '1';
      document.getElementById('nextArticleBtn').disabled = (currentReadingIndex === currentFilteredList.length - 1);
      document.getElementById('nextArticleBtn').style.opacity = (currentReadingIndex === currentFilteredList.length - 1) ? '0.4' : '1';
    }

    function nextArticle() {
      flushSaveCurrentNote();
      if (currentReadingIndex < currentFilteredList.length - 1) {
        openReaderByIndex(currentReadingIndex + 1);
      }
    }

    function prevArticle() {
      flushSaveCurrentNote();
      if (currentReadingIndex > 0) {
        openReaderByIndex(currentReadingIndex - 1);
      }
    }

    // Initialize
    function init() {
      loadReadState();
      renderArticles();

      // 吸顶状态监听：吸顶时平滑贴合视口顶部，消除上方空隙与上圆角露底
      const sentinel = document.getElementById('stickySentinel');
      const filterToolbar = document.getElementById('filterToolbar');
      if (sentinel && filterToolbar && 'IntersectionObserver' in window) {
        const stickyObserver = new IntersectionObserver(([entry]) => {
          filterToolbar.classList.toggle('is-stuck', !entry.isIntersecting);
        }, { threshold: [0] });
        stickyObserver.observe(sentinel);
      }

      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const savedTheme = localStorage.getItem('gefei_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeIcon.textContent = (savedTheme === 'dark') ? '☀️' : '🌙';

      themeToggle.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = (cur === 'dark') ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        themeIcon.textContent = (next === 'dark') ? '☀️' : '🌙';
        localStorage.setItem('gefei_theme', next);
      });

      document.getElementById('resetReadProgressBtn').addEventListener('click', () => {
        if (confirm('确定要清空全部文章的已读阅读进度吗？')) {
          readArticlesSet.clear();
          saveReadState();
          renderArticles();
          if (currentReadingIndex >= 0) updateReaderControls();
        }
      });

      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', (e) => {
        currentFilter.search = e.target.value;
        clearSearchBtn.style.display = currentFilter.search ? 'block' : 'none';
        renderArticles();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentFilter.search = '';
        clearSearchBtn.style.display = 'none';
        renderArticles();
        searchInput.focus();
      });

      const pillButtons = document.querySelectorAll('.pill-btn');
      pillButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          pillButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter.category = btn.getAttribute('data-cat');
          renderArticles();
        });
      });

      document.getElementById('yearSelect').addEventListener('change', (e) => {
        currentFilter.year = e.target.value;
        renderArticles();
      });

      document.getElementById('readStatusSelect').addEventListener('change', (e) => {
        currentFilter.readStatus = e.target.value;
        renderArticles();
      });

      document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentFilter.sort = e.target.value;
        renderArticles();
      });

      document.getElementById('viewGridBtn').addEventListener('click', () => {
        document.getElementById('viewGridBtn').classList.add('active');
        document.getElementById('viewListBtn').classList.remove('active');
        currentFilter.viewMode = 'grid';
        renderArticles();
      });

      document.getElementById('viewListBtn').addEventListener('click', () => {
        document.getElementById('viewListBtn').classList.add('active');
        document.getElementById('viewGridBtn').classList.remove('active');
        currentFilter.viewMode = 'list';
        renderArticles();
      });

      document.getElementById('closeReaderBtn').addEventListener('click', closeReader);
      document.getElementById('readerBackdrop').addEventListener('click', closeReader);
      document.getElementById('prevArticleBtn').addEventListener('click', prevArticle);
      document.getElementById('nextArticleBtn').addEventListener('click', nextArticle);

      document.getElementById('markReadBtn').addEventListener('click', () => {
        if (currentReadingIndex >= 0) {
          const art = currentFilteredList[currentReadingIndex];
          toggleRead(art.id);
        }
      });

      // 笔记面板收起/展开核心逻辑
      const toggleNotesBtn = document.getElementById('toggleNotesBtn');
      const notesPanel = document.getElementById('readerNotesPanel');
      const resizer = document.getElementById('panelResizer');
      const resizerToggleBtn = document.getElementById('resizerToggleBtn');
      const resizerToggleIcon = document.getElementById('resizerToggleIcon');
      const notesCollapseHeaderBtn = document.getElementById('notesCollapseHeaderBtn');

      function updateNotesCollapseState(isCollapsed) {
        notesPanel.classList.toggle('collapsed', isCollapsed);
        resizer.classList.toggle('is-collapsed', isCollapsed);
        toggleNotesBtn.classList.toggle('active', !isCollapsed);

        const isMobile = window.innerWidth <= 768;
        const mobileBackdrop = document.getElementById('notesMobileBackdrop');
        if (mobileBackdrop) {
          mobileBackdrop.classList.toggle('show', !isCollapsed && isMobile);
        }

        if (isCollapsed) {
          if (resizerToggleBtn) resizerToggleBtn.setAttribute('title', '展开笔记面板 (向左展开)');
          if (resizerToggleIcon) resizerToggleIcon.innerHTML = '<polyline points="15 18 9 12 15 6"></polyline>';
        } else {
          if (resizerToggleBtn) resizerToggleBtn.setAttribute('title', '折叠笔记面板 (向右收起)');
          if (resizerToggleIcon) resizerToggleIcon.innerHTML = '<polyline points="9 18 15 12 9 6"></polyline>';
        }
      }

      function toggleNotes(forceState) {
        const isCollapsed = (typeof forceState === 'boolean') ? forceState : !notesPanel.classList.contains('collapsed');
        updateNotesCollapseState(isCollapsed);
        showToast(isCollapsed ? '已收起笔记 (满屏阅读)' : '已打开笔记面板');
      }

      toggleNotesBtn.addEventListener('click', () => toggleNotes());

      const mobileCloseBtn = document.getElementById('mobileCloseBtn');
      if (mobileCloseBtn) mobileCloseBtn.addEventListener('click', closeReader);

      const notesMobileBackdrop = document.getElementById('notesMobileBackdrop');
      if (notesMobileBackdrop) notesMobileBackdrop.addEventListener('click', () => toggleNotes(true));

      if (resizerToggleBtn) {
        resizerToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleNotes();
        });
        resizerToggleBtn.addEventListener('mousedown', (e) => {
          e.stopPropagation();
        });
      }

      if (notesCollapseHeaderBtn) {
        notesCollapseHeaderBtn.addEventListener('click', () => toggleNotes(true));
      }

      // 当笔记已折叠时，点击折叠后的侧边条也可以直接重新展开
      resizer.addEventListener('click', (e) => {
        if (resizer.classList.contains('is-collapsed')) {
          toggleNotes(false);
        }
      });

      // 笔记自动保存输入监听
      const notesTextarea = document.getElementById('articleNotesTextarea');
      notesTextarea.addEventListener('input', () => {
        const statusEl = document.getElementById('notesStatus');
        if (statusEl) {
          statusEl.className = 'notes-status-badge saving';
          statusEl.textContent = '● 保存中...';
        }
        updateNotesStats();
        clearTimeout(noteSaveDebounce);
        noteSaveDebounce = setTimeout(() => {
          flushSaveCurrentNote();
          if (statusEl) {
            statusEl.className = 'notes-status-badge saved';
            statusEl.textContent = '✓ 已自动保存';
          }
        }, 350);
      });

      // 笔记快捷工具按钮
      document.getElementById('toolInspirationBtn').addEventListener('click', () => {
        insertNoteSnippet('\n> 💡 出海灵感：\n');
      });
      document.getElementById('toolKeypointsBtn').addEventListener('click', () => {
        insertNoteSnippet('\n### 🎯 核心要点\n- ');
      });
      document.getElementById('toolActionBtn').addEventListener('click', () => {
        insertNoteSnippet('\n### 🚀 落地行动\n- [ ] ');
      });
      document.getElementById('toolTemplateBtn').addEventListener('click', () => {
        insertNoteSnippet(`\n### 🎯 本篇核心要点\n1. \n2. \n\n### 💡 出海启发与灵感\n- \n\n### 🚀 实战落地行动清单\n- [ ] \n`);
      });
      document.getElementById('toolCopyBtn').addEventListener('click', () => {
        if (!notesTextarea.value.trim()) {
          showToast('当前笔记内容为空');
          return;
        }
        navigator.clipboard.writeText(notesTextarea.value).then(() => {
          showToast('✓ 笔记已成功复制到剪贴板');
        }).catch(() => {
          showToast('复制失败，请手动选择复制');
        });
      });
      document.getElementById('toolExportBtn').addEventListener('click', () => {
        if (currentReadingIndex < 0) return;
        const art = currentFilteredList[currentReadingIndex];
        const content = `# ${art.title}\n\n分类：${art.category} · 年份：${art.year}\n\n---\n\n${notesTextarea.value || '（无笔记内容）'}`;
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `[出海笔记] #${art.id}-${art.title.slice(0, 30)}.md`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('✓ 已导出为 Markdown 文件');
      });
      document.getElementById('clearNoteBtn').addEventListener('click', () => {
        if (confirm('确定要清空本篇文章的笔记吗？')) {
          notesTextarea.value = '';
          notesTextarea.dispatchEvent(new Event('input'));
          showToast('已清空本篇笔记');
        }
      });

      // 左右分栏拖拽拉手
      const drawerBody = document.getElementById('drawerBody');
      const readerIframe = document.getElementById('readerIframe');
      const savedNotesWidth = localStorage.getItem('gefei_notes_width');
      if (window.innerWidth > 768 && savedNotesWidth && notesPanel) {
        notesPanel.style.width = savedNotesWidth + 'px';
      }

      resizer.addEventListener('mousedown', (e) => {
        if (resizer.classList.contains('is-collapsed')) return;
        if (e.target.closest('#resizerToggleBtn')) return;
        isResizingNotes = true;
        resizer.classList.add('is-dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        if (readerIframe) readerIframe.style.pointerEvents = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isResizingNotes || !drawerBody || !notesPanel) return;
        const bodyRect = drawerBody.getBoundingClientRect();
        const newWidth = bodyRect.right - e.clientX;
        if (newWidth >= 280 && newWidth <= Math.min(800, bodyRect.width - 320)) {
          notesPanel.style.width = newWidth + 'px';
          localStorage.setItem('gefei_notes_width', newWidth);
        }
      });

      window.addEventListener('mouseup', () => {
        if (isResizingNotes) {
          isResizingNotes = false;
          resizer.classList.remove('is-dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          if (readerIframe) readerIframe.style.pointerEvents = 'auto';
        }
      });

      const drawer = document.getElementById('readerDrawer');
      window.addEventListener('keydown', (e) => {
        const isDrawerOpen = drawer.classList.contains('open');

        if (e.key === 'Escape') {
          if (isDrawerOpen) closeReader();
        } else if (e.key === '/' && !isDrawerOpen && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (isDrawerOpen) {
          const isWritingNote = document.activeElement === notesTextarea;
          if (!isWritingNote) {
            if (e.key === 'ArrowRight' || e.key === ']') {
              e.preventDefault();
              nextArticle();
            } else if (e.key === 'ArrowLeft' || e.key === '[') {
              e.preventDefault();
              prevArticle();
            } else if (e.key.toLowerCase() === 'm') {
              e.preventDefault();
              if (currentReadingIndex >= 0) {
                toggleRead(currentFilteredList[currentReadingIndex].id);
              }
            } else if (e.key.toLowerCase() === 'n') {
              e.preventDefault();
              toggleNotesBtn.click();
            }
          }
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
